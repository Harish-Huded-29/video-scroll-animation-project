<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Scroll Video Demo</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --fg: #f4f4f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #000;
      scroll-behavior: smooth;
    }

    body {
      background: #000;
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    [hidden] {
      display: none !important;
    }

    #area {
      position: relative;
    }

    #stage {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #progress {
      position: fixed;
      left: 0;
      top: 0;
      height: 3px;
      width: 0;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
      z-index: 90;
    }

    /* Navigation Bar */
    .top-nav {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .glass {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      color: #fff;
      font: 600 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 12px 18px;
      background: rgba(20, 20, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      backdrop-filter: blur(16px) saturate(1.4);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.6);
      transition: background .15s, transform .15s, border-color .15s;
      user-select: none;
      text-decoration: none;
    }

    .glass:hover {
      background: rgba(45, 45, 62, 0.98);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75), 0 0 20px rgba(99, 102, 241, 0.35);
    }

    .glass:active {
      transform: scale(0.97);
    }

    .glass svg {
      width: 18px;
      height: 18px;
      flex: none;
      stroke: currentColor;
    }

    /* Floating Info Pill */
    .info-pill {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 14px;
      background: rgba(18, 18, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      font-size: 0.85rem;
      font-weight: 600;
      color: #e4e4e7;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .info-pill .badge {
      background: #6366f1;
      color: #fff;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .counter {
      color: #a5b4fc;
      font-variant-numeric: tabular-nums;
    }

    /* Scroll Direction Hint */
    #hint {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
      background: rgba(15, 15, 22, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 10px 20px;
      border-radius: 999px;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      animation: bob 1.8s ease-in-out infinite;
      transition: opacity .5s, transform .5s;
    }

    #hint.hide {
      opacity: 0;
      transform: translate(-50%, 15px);
      pointer-events: none;
    }

    @keyframes bob {

      0%,
      100% {
        transform: translate(-50%, 0);
      }

      50% {
        transform: translate(-50%, 7px);
      }
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: #0b0b0d;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      justify-content: center;
      transition: opacity .6s ease;
    }

    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .bar {
      width: min(340px, 75vw);
      height: 6px;
      background: #1c1c24;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width .15s ease-out;
    }

    #pct {
      font-size: 0.9rem;
      color: #a1a1aa;
      font-weight: 500;
    }

    /* Bottom link banner */
    .footer-cta {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
    }
  </style>
</head>

<body>

  <div id="loader">
    <div class="loader-title">🎬 Loading Scroll Video Demo…</div>
    <div class="bar"><i id="fill"></i></div>
    <div id="pct">Loading 0%</div>
  </div>

  <div id="progress"></div>

  <!-- Top Left Info Pill -->
  <div class="info-pill">
    <span class="badge">Live Demo</span>
    <span>Frame: <span class="counter" id="curFrame">1</span> / 265</span>
  </div>

  <!-- Top Right Action Controls -->
  <div class="top-nav">
    <button class="glass" id="fsBtn" title="Toggle Fullscreen mode (Esc to exit)">
      <svg id="fsIcoEnter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
      </svg>
      <svg id="fsIcoExit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" hidden>
        <path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6l7 7M14 4v6m0 0h6m-6 0L21 3M10 4v6m0 0H4m6 0L3 3" />
      </svg>
      <span id="fsText">Fullscreen</span>
    </button>
  </div>

  <!-- Floating Scroll Hint -->
  <div id="hint">Scroll down ↓ to play forward · Scroll up ↑ to play reverse</div>

  <!-- Canvas Scroll Stage -->
  <div id="area">
    <div id="stage"><canvas id="canvas"></canvas></div>
  </div>

  <script>
    const N = 265;
    const SCREENS = 18;
    const EASE = 0.16;
    const FIT = "cover";

    const $ = id => document.getElementById(id);
    const canvas = $("canvas"), ctx = canvas.getContext("2d", { alpha: false });
    const area = $("area"), loader = $("loader"), pct = $("pct"), fill = $("fill");
    const progressBar = $("progress"), hint = $("hint"), curFrameSpan = $("curFrame");

    const frames = new Array(N).fill(null);
    let loadedCount = 0, current = 0, target = 0, lastImg = null, cw = 0, ch = 0;

    area.style.height = (SCREENS + 1) * 100 + "vh";
    const url = i => `frames/frame_${String(i + 1).padStart(4, "0")}.webp`;

    /* Frame Preloading */
    function loadFrame(i) {
      return new Promise(resolve => {
        if (frames[i]) return resolve();
        const img = new Image();
        img.src = url(i);
        const done = () => { frames[i] = img; loadedCount++; resolve(); };
        (img.decode ? img.decode() : Promise.reject()).then(done).catch(() => {
          img.onload = done; img.onerror = resolve;
          if (img.complete) done();
        });
      });
    }

    async function runQueue(list, workers, onStep) {
      let p = 0;
      async function worker() { while (p < list.length) { const i = list[p++]; await loadFrame(i); onStep && onStep(); } }
      await Promise.all(Array.from({ length: workers }, worker));
    }

    async function loadAll() {
      const stride = Math.max(1, Math.round(N / 40));
      const coarse = [], rest = [];
      for (let i = 0; i < N; i++) (i % stride === 0 || i === N - 1 ? coarse : rest).push(i);
      let done = 0;
      await runQueue(coarse, 6, () => {
        done++;
        const p = Math.round(done / coarse.length * 100);
        pct.textContent = "Loading " + p + "%"; fill.style.width = p + "%";
      });
      start();
      await runQueue(rest, 4);
    }

    function nearestLoaded(i) {
      for (let d = 0; d < N; d++) {
        if (frames[i - d]) return frames[i - d];
        if (frames[i + d]) return frames[i + d];
      }
      return null;
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
      if (w === cw && h === ch) return;
      cw = canvas.width = w; ch = canvas.height = h; lastImg = null; onScroll();
    }

    function paint(img) {
      const s = FIT === "cover" ? Math.max(cw / img.width, ch / img.height) : Math.min(cw / img.width, ch / img.height);
      const w = img.width * s, h = img.height * s;
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
    }

    function onScroll() {
      const total = area.offsetHeight - window.innerHeight;
      const p = Math.min(1, Math.max(0, window.scrollY / total));
      target = p * (N - 1);
      progressBar.style.width = (p * 100) + "%";
      if (window.scrollY > 40) hint.classList.add("hide");
    }

    let lastT = performance.now();
    function tick(t) {
      const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
      const k = 1 - Math.pow(1 - EASE, dt * 60);
      current += (target - current) * k;
      if (Math.abs(target - current) < 0.005) current = target;

      const frameIdx = Math.round(current);
      if (curFrameSpan) curFrameSpan.textContent = frameIdx + 1;
      const img = nearestLoaded(frameIdx);
      if (img && img !== lastImg) { paint(img); lastImg = img; }
      requestAnimationFrame(tick);
    }

    function start() {
      resize(); onScroll(); current = target;
      loader.classList.add("hide");
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", resize);
      requestAnimationFrame(tick);
    }

    /* Fullscreen Toggle & Esc handler */
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.warn(err));
      } else {
        document.exitFullscreen().catch(err => console.warn(err));
      }
    }

    function updateFullscreenUi() {
      const isFs = !!document.fullscreenElement;
      $("fsIcoEnter").hidden = isFs;
      $("fsIcoExit").hidden = !isFs;
      $("fsText").textContent = isFs ? "Exit Fullscreen" : "Fullscreen";
    }

    $("fsBtn").onclick = toggleFullscreen;
    document.addEventListener("fullscreenchange", updateFullscreenUi);

    // Esc key listener (natively handled by browser, updates UI on exit)
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && document.fullscreenElement) {
        document.exitFullscreen().catch(() => { });
      }
    });

    loadAll();
  </script>
</body>

</html>
